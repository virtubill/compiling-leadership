baseURL = 'https://compilingleadership.com/'
locale = 'en-us'
title = 'Compiling Leadership'
theme = 'PaperMod'

enableRobotsTXT = true
pygmentsUseClasses = true

[params]
  env = "production"
  description = "Notes on leadership, written by an engineer."
  defaultTheme = "auto"
  disableThemeToggle = true
  hideFooter = true
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = false
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = false
  ShowRssButtonInSectionTermList = false
  ShowToc = false
  comments = false
  disableScrollToTop = true

  [params.profileMode]
    enabled = true
    title = "Compiling Leadership"
    subtitle = "Notes on leadership, written by an engineer. More soon."
