{{ define "main" }}
  {{ .Content }}
  <h2>Recent posts</h2>
  <ul class="post-list">
    {{ range (where .Site.RegularPages "Type" "posts") }}
      <li>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        <span class="post-date">{{ .Date.Format "Jan 2, 2006" }}</span>
      </li>
    {{ end }}
  </ul>
{{ end }}
